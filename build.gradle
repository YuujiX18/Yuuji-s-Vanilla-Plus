plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = 'yuuji'
}

repositories {
    // Loom supplies Mojang/Fabric repositories.
}

loom {
    splitEnvironmentSourceSets()
    mods {
        'yuuji' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

// Decode worldgen with the target Minecraft engine, not just a JSON syntax check.
// Dedicated source set keeps the isolated registry test harness out of the mod JAR.
sourceSets {
    oreValidation {
        java.srcDir 'src/oreValidation/java'
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}
tasks.register('validateOreData', JavaExec) {
    dependsOn tasks.named('classes'), tasks.named('compileOreValidationJava')
    classpath = sourceSets.oreValidation.runtimeClasspath
    mainClass = 'dev.yuuji.validation.WorldgenDataValidation'
    workingDir = layout.buildDirectory.dir('ore-validation').get().asFile
    args file('src/oreValidation/resources/legacy').absolutePath,
         file('src/main/resources/data/yuuji').absolutePath
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('validateOreData') }

tasks.register('validateQuiver', JavaExec) {
    dependsOn tasks.named('classes'), tasks.named('compileOreValidationJava')
    classpath = sourceSets.oreValidation.runtimeClasspath
    mainClass = 'dev.yuuji.validation.QuiverValidation'
    workingDir = layout.buildDirectory.dir('quiver-validation').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('validateQuiver') }

tasks.register('validateQuiverAcquisition', JavaExec) {
    dependsOn tasks.named('classes'), tasks.named('compileOreValidationJava')
    classpath = sourceSets.oreValidation.runtimeClasspath
    mainClass = 'dev.yuuji.validation.QuiverAcquisitionValidation'
    workingDir = layout.buildDirectory.dir('quiver-acquisition-validation').get().asFile
    args file('src/main/resources/data').absolutePath
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('validateQuiverAcquisition') }

tasks.register('validateAzureSteel', JavaExec) {
    dependsOn tasks.named('classes'), tasks.named('compileOreValidationJava')
    classpath = sourceSets.oreValidation.runtimeClasspath
    mainClass = 'dev.yuuji.validation.AzureSteelValidation'
    workingDir = layout.buildDirectory.dir('azure-steel-validation').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('validateAzureSteel') }

tasks.register('validateExpansion', JavaExec) {
    dependsOn tasks.named('classes'), tasks.named('compileOreValidationJava')
    classpath = sourceSets.oreValidation.runtimeClasspath
    mainClass = 'dev.yuuji.validation.ExpansionValidation'
    args file('src/main/resources').absolutePath
    workingDir = layout.buildDirectory.dir('expansion-validation').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn tasks.named('validateExpansion') }

// Optional real Fabric/Mixin bootstrap test. Exits before the game window or a world opens.
tasks.register('quiverValidationMod', Jar) {
    dependsOn tasks.named('compileOreValidationJava')
    archiveFileName = 'quiver-validation.jar'
    destinationDirectory = layout.buildDirectory.dir('quiver-validation')
    from sourceSets.oreValidation.output.classesDirs
    from 'src/oreValidation/fabric-validation'
}
tasks.register('validateQuiverFabric', JavaExec) {
    dependsOn tasks.named('jar'), tasks.named('quiverValidationMod'), tasks.named('clientClasses')
    def modJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def testJar = tasks.named('quiverValidationMod', Jar).flatMap { it.archiveFile }
    classpath = files(provider {
        sourceSets.client.compileClasspath.files.findAll {
            !it.toPath().startsWith(layout.buildDirectory.get().asFile.toPath())
        }
    }, modJar, testJar)
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    workingDir = layout.buildDirectory.dir('quiver-fabric-validation').get().asFile
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'fabric.development', 'true'
    systemProperty 'yuuji.expansion.resources', file('src/main/resources').absolutePath
    doFirst {
        new File(workingDir, 'game/mods').mkdirs()
        systemProperty 'fabric.addMods', modJar.get().asFile.absolutePath + File.pathSeparator + testJar.get().asFile.absolutePath
        args '--gameDir', new File(workingDir, 'game').absolutePath
    }
}

tasks.register('exportVerticalSources', JavaExec) {
 dependsOn tasks.named('classes'),tasks.named('compileOreValidationJava')
 classpath=sourceSets.oreValidation.runtimeClasspath
 mainClass='dev.yuuji.validation.VerticalSourceExport'
 args file('../vertical55-sources.json').absolutePath
}